[package]
name = "channelpulse"
version = "1.0.0"
description = "ChannelPulse OSS - A lightning-fast AI assistant that works seamlessly during meetings, interviews, and conversations."
authors = ["Srikanth Nani <srikanthnani1202@gmail.com>"]
license = "GPL-3.0"
repository = "https://github.com/willysharp5/ChannelPulse-desktop"
homepage = "https://github.com/willysharp5/ChannelPulse-desktop"
documentation = "https://github.com/willysharp5/ChannelPulse-desktop"
readme = "../README.md"
keywords = ["ai-assistant", "tauri", "desktop-app", "meeting-assistant"]
categories = ["gui", "multimedia", "accessibility", "science", "development-tools"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "channelpulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenv = "0.15"

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2.5.2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-keychain = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25.6"
xcap = "0.0.12"
base64 = "0.22"
cpal = "0.15.3"
hound = "3.5.1"
tokio = { version = "1.0", features = ["full"] }
once_cell = "1.19.0"
uuid = { version = "1.0", features = ["v4"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
dotenv = "0.15"
futures-util = "0.3"
anyhow = "1.0"
tracing = "0.1"
# Without a subscriber installed, every tracing::error!/warn! in this crate
# compiles to a no-op — all 50 of them were silently dropped, which is why an
# audio bug report could never be answered from the log. See init_tracing().
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ringbuf = "0.4.8"
tauri-plugin-shell = "2.3.1"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-machine-uid = "0.1.2"
pdf-extract = "0.12.0"
sha2 = "0.10"
urlencoding = "2"
rand = "0.8"
humantime = "2"
# Offline on-device speech-to-text (whisper.cpp). Builds whisper.cpp from source
# via cmake/clang at compile time.
whisper-rs = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-permissions = "2"
cidre = "0.11.3"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2" }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.19.0"
# IVirtualDesktopManager, so the overlay can follow the active virtual desktop.
# tao does not implement `set_visible_on_all_workspaces` on Windows, so
# `visibleOnAllWorkspaces` in tauri.conf.json is a no-op there — see
# src/virtual_desktop.rs. 0.61 is already in Cargo.lock via tauri, so this pins to
# the version cargo already resolves rather than pulling a second copy.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.0"
